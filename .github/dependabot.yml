version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    # Monthly, not weekly: each Dependabot PR runs CI, and CI minutes are metered. Security
    # updates are still raised as soon as they are published, regardless of this schedule.
    schedule:
      interval: monthly
    target-branch: staging
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    groups:
      # react + react-dom must move together — npm hard-fails ERESOLVE when the
      # two differ (see closed PRs #426/#446, which deadlocked each other).
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Every other minor and patch bump lands in one PR per month.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TS majors (6/7 native compiler) break Build + Lint until Next toolchain
      # supports them — see closed PR #389. Minors/patches still flow.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react peers cap at eslint ^9.7, so ESLint 10 dies with
      # "contextOrFilename.getFilename is not a function" — see closed PR #460.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # eslint-config-next 16.4 requires eslint-plugin-react-hooks ^7.1, whose React Compiler
      # rules flag 121 existing sites (90 set-state-in-effect, 20 refs) — see closed PR #645.
      # package.json `overrides` holds the plugin at 7.0.1. Drop both when those sites are fixed.
      - dependency-name: "eslint-config-next"
        versions: [">=16.4.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    target-branch: staging
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
