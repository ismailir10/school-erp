name: CI

# Every ready PR gets two checks, plus E2E (e2e.yml) when it carries the `e2e` label:
#   Checks        ~20 s  docs sync + audit, hook tests, keepalive/alert/workflow self-tests
#   Test & Build  ~5 min typecheck, lint, unit tests, RLS + API-auth guards, production build
#
# CI runs on PRs only, never on pushes to staging/main. A promotion PR's head is staging itself, so
# push runs duplicated every check it already ran (15 rows on one PR). The promotion PR still runs all
# three on the exact tree that reaches production. Draft PRs skip CI entirely (metered minutes).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [staging, main]
  workflow_dispatch:

# A new push to a PR cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Replicates .githooks/pre-commit rule 2 so `git commit --no-verify` cannot bypass it: a PR that
      # touches app/, components/, lib/ or prisma/ must also update README.md, CLAUDE.md or a cycle doc.
      - name: Docs sync
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(app|components|lib|prisma)/' \
            && ! echo "$CHANGED" | grep -qE '^(README\.md|CLAUDE\.md|docs/cycles/.*\.md)$'; then
            echo "::error::This PR changes app/, components/, lib/ or prisma/ but updates none of README.md, CLAUDE.md or docs/cycles/*.md."
            exit 1
          fi
          echo "Docs sync OK"

      # The presence check above only proves *a* doc was touched — README and CLAUDE.md can rot while
      # every PR stays green. This is the truth check: the docs still describe the repo.
      - name: Doc staleness audit
        run: bash scripts/audit-docs.sh

      - name: Workflow audit and hook regression tests
        run: |
          bash scripts/test-audit-docs.sh
          bash scripts/test-hooks.sh

      # The shared spec/build/verify-local/ship skills are vendored from agent-workflow. Offline checksum
      # check: fails when a vendored file was edited here instead of upstream.
      - name: Vendored agent-workflow skills unchanged
        run: bash scripts/sync-agent-workflow.sh --check

      # Regression guard for the two scripts that stand between a production outage and somebody
      # finding out. Both run against local fixtures (a loopback HTTP server, a stub `gh`), so this
      # cannot touch production. Alerting code only runs during an incident: the inline alert these
      # replaced was broken for eighteen nights and nothing noticed, since nothing tested it.
      - name: Shellcheck the keepalive and alert scripts
        run: shellcheck --severity=warning scripts/keepalive-probe.sh scripts/alert-issue.sh

      - name: Keepalive probe self-test
        env:
          # Retries exist to absorb blips in production, not to slow CI down.
          KEEPALIVE_ATTEMPTS: '2'
          KEEPALIVE_RETRY_DELAY: '0'
        run: bash scripts/keepalive-probe.sh self-test

      - name: Alert-issue self-test
        run: bash scripts/alert-issue.sh self-test

      # The defect that silenced backup.yml for eighteen nights was a gh call in a job with no GH_REPO
      # and no checkout; the one that silenced every alert until 2026-10-16 was a checkout with no
      # `contents` permission. Assert by inspection that neither can come back.
      - name: Assert workflow gh calls have GH_REPO and checkouts can read contents
        run: |
          set -euo pipefail
          # PyYAML is not guaranteed on the runner image, so do not assume it.
          python3 -c 'import yaml' 2>/dev/null \
            || python3 -m pip install --quiet --disable-pip-version-check pyyaml
          # A guard that never fires looks exactly like a clean repo, so prove it fires first.
          python3 scripts/check-workflow-gh-repo.py --self-test
          python3 scripts/check-workflow-gh-repo.py .github/workflows/*.yml

  test-build:
    name: Test & Build
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (runs prisma generate + tsc --noEmit)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: RLS coverage guard
        run: bash scripts/verify-rls-coverage.sh

      - name: API auth coverage guard
        run: bash scripts/verify-api-auth.sh

      - name: Next.js build (runs prisma generate via npm script)
        run: npm run build
        env:
          DEMO_MODE: "true"
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/schoolerp"
          NEXTAUTH_SECRET: "ci-build-dummy-secret"
