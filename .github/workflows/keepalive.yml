name: Prod Keepalive

# Second leg of the production keepalive, independent of UptimeRobot.
#
# The prod Supabase project is on the free tier, which auto-pauses after 7 days
# idle. It has paused twice — 2026-05-02 and 2026-09-09 — each time taking Google
# sign-in down at the network layer, because a paused project's hostname stops
# resolving entirely. Both times an UptimeRobot monitor pinging /api/health every
# 5 minutes was supposed to prevent exactly that.
#
# This workflow shares no account, scheduler or notification channel with
# UptimeRobot, so the two legs fail independently. Each covers the other's blind
# spot: a run that never happens cannot notice it never happened (see
# check-cadence below), and a monitor living only in an owner-only dashboard
# leaves no evidence in the repo. Neither is sufficient alone.
#
# See docs/runbooks/prod-incident.md §3.

on:
  schedule:
    # Every 3 hours. 8 pings/day against a 7-day idle timer is ~56x margin, so
    # the keepalive survives GitHub delaying scheduled runs under load.
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'Override the probe URL (use a deliberately wrong one to rehearse the alert path)'
        type: string
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: prod-keepalive
  # Never cancel a probe mid-flight: a cancelled run is neither a keepalive nor
  # a signal, and would silently skip a ping.
  cancel-in-progress: false

env:
  PROD_HEALTH_URL: https://talib.annisaasekolahku.com/api/health

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions:read is what lets check-cadence below call `gh run list` against
    # this workflow's own history. Naming a permissions block sets every scope
    # not listed to none, so without this the cadence check 403s — silently,
    # since it is continue-on-error.
    permissions:
      contents: read
      actions: read
    outputs:
      class: ${{ steps.probe.outputs.class }}
      cadence: ${{ steps.cadence.outputs.cadence }}
    steps:
      - uses: actions/checkout@v7

      # Catches the schedule quietly becoming erratic — the analogue of the
      # nightly backup's bucket-freshness guard. It CANNOT catch the schedule
      # stopping outright (GitHub disables scheduled workflows after 60 days of
      # repo inactivity), because a run that never happens cannot check itself.
      # That specific blind spot is the one UptimeRobot covers.
      # This step writes `cadence=ok|degraded|unknown`, which the cadence-alert
      # and cadence-resolve jobs below turn into a real notification. It used to
      # emit only `::warning::`, which meant a degraded schedule was visible
      # solely to whoever opened the run log — and the whole point of this cycle
      # is that nobody opens the run log. A warning nobody receives is the same
      # silent failure as backup.yml's, one level up.
      #
      # It stays continue-on-error on purpose: the probe below is the actual
      # keepalive, and a broken check-on-a-check must never stop the ping. So
      # `set -e` is off here too — an aborted step would write no output at all,
      # and a missing output is indistinguishable from a healthy one.
      - name: Check the schedule is actually firing
        id: cadence
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MAX_GAP_HOURS: '12'
        run: |
          set -uo pipefail
          STATE=unknown
          PREV=$(gh run list --workflow=keepalive.yml --status=success \
            --limit 1 --json createdAt --jq '.[0].createdAt // empty' 2>&1) || PREV='__LOOKUP_FAILED__'
          if [ "$PREV" = '__LOOKUP_FAILED__' ]; then
            echo "::warning::Could not read this workflow's own run history, so the schedule's cadence is unknown this run. The probe below is unaffected."
            STATE=unknown
          elif [ -z "$PREV" ]; then
            echo "  no previous successful run — first run of this workflow, nothing to compare"
            STATE=ok
          else
            GAP=$(( ( $(date -u +%s) - $(date -u -d "$PREV" +%s) ) / 3600 ))
            echo "  last successful run: $PREV (${GAP}h ago, budget ${MAX_GAP_HOURS}h)"
            if [ "$GAP" -gt "$MAX_GAP_HOURS" ]; then
              echo "::warning::The keepalive last succeeded ${GAP}h ago, beyond the ${MAX_GAP_HOURS}h budget for a 3-hourly schedule. The schedule may be degraded or was disabled and re-enabled."
              STATE=degraded
            else
              STATE=ok
            fi
          fi
          echo "  cadence=$STATE"
          echo "cadence=$STATE" >> "$GITHUB_OUTPUT"

      - name: Probe /api/health
        id: probe
        env:
          URL: ${{ inputs.url || env.PROD_HEALTH_URL }}
        run: |
          set -euo pipefail
          OUT=$(bash scripts/keepalive-probe.sh probe "$URL" 2>&1) && RC=0 || RC=$?
          printf '%s\n' "$OUT"
          printf '%s\n' "$OUT" | grep -oE '^class=.*' >> "$GITHUB_OUTPUT" || echo "class=unknown" >> "$GITHUB_OUTPUT"
          exit "$RC"

      - name: Summary
        if: always()
        env:
          URL: ${{ inputs.url || env.PROD_HEALTH_URL }}
          CLASS: ${{ steps.probe.outputs.class }}
        run: |
          {
            echo "### Prod keepalive — \`$CLASS\`"
            echo
            echo "- URL: $URL"
            echo "- A healthy probe runs \`SELECT 1\` on the prod database, so it is the keepalive as well as the check."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Fail loudly. A red scheduled workflow notifies nobody — backup.yml's alert
  # job proved that twice over, first by not existing and then by being broken
  # for eighteen nights. This one checks out the repo, sets GH_REPO, and uses
  # the same self-tested scripts/alert-issue.sh, so it cannot repeat either.
  # ---------------------------------------------------------------------------
  alert:
    needs: keepalive
    if: always() && needs.keepalive.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Open or update the prod-down issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ALERT_LABEL_DESCRIPTION: Production health probe is failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLASS: ${{ needs.keepalive.outputs.class }}
          URL: ${{ inputs.url || env.PROD_HEALTH_URL }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          cat > body.md <<EOF
          The production health **probe** failed: \`${CLASS:-unknown}\`

          - URL probed: $URL
          - Run: $RUN_URL
          - Workflow: \`.github/workflows/keepalive.yml\`

          > **This says the probe failed, not that production is definitely down.**
          > This issue is opened for *any* failure of the keepalive job, which
          > includes a checkout, runner or script failure, and a deliberate
          > rehearsal dispatched with an override URL. Confirm against the real
          > URL before declaring an outage — start with the class above and the
          > commands below.

          ## Confirm in under a minute

          \`\`\`bash
          curl -i https://talib.annisaasekolahku.com/api/health
          dig +short vxwywmvpxetdgnxejjgk.supabase.co
          \`\`\`

          | Class | What the probe actually established |
          |---|---|
          | \`db_paused\` | 503 \`db_unreachable\` **and** the database hostname no longer resolves. That pair is the auto-pause signature → §3: restore from the Supabase dashboard. |
          | \`db_unreachable\` | 503, but the hostname still resolves — the project is up and the database is not reachable from the app. **Not** a pause; restoring will not help → §4. |
          | \`unreachable\` | curl never connected — DNS, TLS or the Vercel edge → §1. |
          | \`app_error\` / \`bad_body\` | The app or its deploy is broken → §1, §2. |
          | \`unknown\` | The probe step itself did not run to completion. Check the run log first. |

          Full procedure: \`docs/runbooks/prod-incident.md\`. After recovery,
          re-run this workflow — a healthy probe closes this issue automatically.

          @$OWNER — this issue is reused for every consecutive failure.
          EOF
          bash scripts/alert-issue.sh open prod-down \
            "Production health probe is failing" body.md "$OWNER"

  # Close the alert once the probe passes again, so an open issue always means
  # "the probe is failing right now". Deliberately not "prod is down": the alert
  # fires on any keepalive-job failure, and a rehearsal dispatch with a wrong
  # URL opens it while production is perfectly healthy. The issue body says so.
  resolve:
    needs: keepalive
    if: always() && needs.keepalive.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Close any open prod-down issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/alert-issue.sh close prod-down "Prod health probe is passing again — $RUN_URL"

  # ---------------------------------------------------------------------------
  # A degraded SCHEDULE is its own failure, and its own alert.
  #
  # The cadence check above can find that the keepalive has not succeeded within
  # its budget while this very run's probe is perfectly healthy — prod is fine,
  # the monitor is not. Routing that into the prod-down issue would cry outage
  # over a scheduling problem; leaving it as a log warning, which is what it was,
  # notifies nobody at all. So it gets a distinct label, a distinct title and a
  # non-red colour: a monitor-health alert, not a production one.
  # ---------------------------------------------------------------------------
  cadence-alert:
    needs: keepalive
    if: always() && needs.keepalive.outputs.cadence == 'degraded'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Open or update the keepalive-degraded issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ALERT_LABEL_DESCRIPTION: The keepalive schedule itself is degraded
          ALERT_LABEL_COLOR: FBCA04
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          cat > cadence.md <<EOF
          The keepalive **schedule** is degraded. This is a monitoring problem,
          not (necessarily) a production one — check the run for this cycle's
          probe result before assuming anything about prod.

          - Run: $RUN_URL
          - Workflow: \`.github/workflows/keepalive.yml\` (cron: every 3 hours)

          The run history shows no successful run inside the 12-hour budget. The
          usual causes, in order of likelihood:

          1. **GitHub disabled the schedule.** Scheduled workflows are disabled
             after 60 days without repository activity. Re-enable it under
             Actions → Prod Keepalive.
          2. **GitHub is delaying scheduled runs under load.** Common, usually
             self-correcting; if the gap is small and shrinking, ignore it.
          3. **The workflow has been failing repeatedly.** Then there is an open
             \`prod-down\` issue too, and that one is the real story.

          While the schedule is degraded this leg is not keeping the database
          awake, and the free-tier project is back to relying on UptimeRobot
          alone — which is the single point of failure this workflow exists to
          remove. See \`docs/runbooks/prod-incident.md\` §3.

          @$OWNER — closed automatically once the schedule is running to budget.
          EOF
          bash scripts/alert-issue.sh open keepalive-degraded \
            "Prod keepalive schedule is degraded" cadence.md "$OWNER"

  cadence-resolve:
    needs: keepalive
    if: always() && needs.keepalive.outputs.cadence == 'ok'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Close any open keepalive-degraded issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/alert-issue.sh close keepalive-degraded \
            "The keepalive schedule is running to budget again — $RUN_URL"
